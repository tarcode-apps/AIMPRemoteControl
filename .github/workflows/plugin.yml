name: plugin

# Releases of the plugin are tagged plugin-v<version>, the version of
# plugin/src/pluginInfo.h; other parts of the repository have tags of their own.
on:
  push:
    tags: ['plugin-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: windows-${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build
        shell: pwsh
        run: .\plugin\build-windows.ps1 -Arch ${{ matrix.arch }} -Config Release

      - name: Unit tests
        shell: pwsh
        run: .\plugin\test-windows.ps1 -Arch ${{ matrix.arch }} -Config Release

      - uses: actions/upload-artifact@v6
        with:
          name: AIMPRemoteControlPlugin-windows-${{ matrix.arch }}
          path: plugin/dist/windows-${{ matrix.arch }}/
          if-no-files-found: error

  linux:
    name: linux-x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      # cmake and g++ come with the runner image; ninja does not.
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Build
        run: bash plugin/build-linux.sh --release

      - name: Unit tests
        run: bash plugin/test-linux.sh --release

      - uses: actions/upload-artifact@v6
        with:
          name: AIMPRemoteControlPlugin-linux-x64
          path: plugin/dist/linux-x64/
          if-no-files-found: error

  web-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web-client/package-lock.json

      - name: Build
        working-directory: web-client
        run: |
          npm ci
          npm run lint
          npm run build

      - uses: actions/upload-artifact@v6
        with:
          name: AIMPRemoteControlPlugin-web-client
          path: web-client/out/
          if-no-files-found: error

  # .aimppack = zip with the plugin folder laid out as AIMP expects
  # (SDK: "Plugin folder structure"):
  #   aimp_remote_control/Langs/*.lng
  #   aimp_remote_control/wwwroot/**                   static site for browsers
  #   aimp_remote_control/aimp_remote_control.dll      Windows x86
  #   aimp_remote_control/x64/aimp_remote_control.dll  Windows x64
  #   aimp_remote_control/x64/aimp_remote_control.so   Linux x64
  #   aimp_remote_control/readme.txt, LICENSE.txt, THIRD-PARTY-NOTICES.txt
  package:
    name: aimppack
    needs: [windows, linux, web-client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6 # for LICENSE.txt and docs/catalog/

      - name: Read the plugin version
        run: |
          set -eu
          version=$(sed -n "s/^#define PLUGIN_VERSION_\(MAJOR\|MINOR\|PATCH\)[[:space:]]\+//p" plugin/src/pluginInfo.h | paste -sd.)
          echo "PLUGIN_VERSION=$version" >> "$GITHUB_ENV"
          echo "plugin version: $version"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "plugin-v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the plugin version $version (plugin-v$version)" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Lay out the plugin folder
        run: |
          set -eu
          pkg=pack/aimp_remote_control
          mkdir -p "$pkg/x64"
          cp -r artifacts/AIMPRemoteControlPlugin-windows-x86/Langs "$pkg/Langs"
          cp -r artifacts/AIMPRemoteControlPlugin-web-client "$pkg/wwwroot"
          cp artifacts/AIMPRemoteControlPlugin-windows-x86/aimp_remote_control.dll "$pkg/"
          cp artifacts/AIMPRemoteControlPlugin-windows-x64/aimp_remote_control.dll "$pkg/x64/"
          cp artifacts/AIMPRemoteControlPlugin-linux-x64/aimp_remote_control.so "$pkg/x64/"
          cp LICENSE.txt "$pkg/"
          # readme.txt is also the txt the catalog rules want inside the folder.
          sed "s/{VERSION}/$PLUGIN_VERSION/" docs/catalog/readme.txt > "$pkg/readme.txt"
          cp artifacts/AIMPRemoteControlPlugin-windows-x86/THIRD-PARTY-NOTICES.txt "$pkg/"
          # The plugin's notices cover third_party/ only; the web client bundles
          # npm packages of its own, whose licenses the build emits into the export.
          web_notices="$pkg/wwwroot/_next/static/third-party-licenses.txt"
          if [ ! -f "$web_notices" ]; then
            echo "::error::web client licenses are missing from the artifact" >&2
            exit 1
          fi
          {
            echo
            echo "--------------------------------------------------------------------------"
            echo "web client (npm)"
            echo "--------------------------------------------------------------------------"
            echo
            cat "$web_notices"
          } >> "$pkg/THIRD-PARTY-NOTICES.txt"
          find pack -type f | sort
          (cd pack && zip -r ../aimp_remote_control.aimppack aimp_remote_control)

      - uses: actions/upload-artifact@v6
        with:
          name: aimp_remote_control.aimppack
          path: aimp_remote_control.aimppack
          if-no-files-found: error

      # What the AIMP addons catalog asks for, see docs/catalog/README.md:
      # the same folder under the name the rules want, the description file with
      # the version filled in, and the screenshot when the repo carries one.
      - name: Build the catalog bundle
        run: |
          set -eu
          mkdir catalog
          cp aimp_remote_control.aimppack catalog/aimp_remote_control.zip
          sed "s/{VERSION}/$PLUGIN_VERSION/" docs/catalog/aimp_remote_control.txt > catalog/aimp_remote_control.txt
          shots=()
          for f in docs/catalog/aimp_remote_control_{sm,full}.{png,jpg}; do
            if [ -f "$f" ]; then shots+=("$f"); fi
          done
          if [ ${#shots[@]} -gt 0 ]; then
            cp "${shots[@]}" catalog/
          else
            echo "::warning::no docs/catalog/aimp_remote_control_sm.png - the bundle ships without screenshots"
          fi
          if ! grep -q "^Topic: http" catalog/aimp_remote_control.txt; then
            echo "::warning::Topic: has no forum link - fill it in before sending the bundle to the catalog"
          fi
          cat catalog/aimp_remote_control.txt

      - uses: actions/upload-artifact@v6
        with:
          name: aimp_remote_control-catalog
          path: catalog/
          if-no-files-found: error

      # The text of the forum topic with the version filled in; it goes to the
      # forum, not to the catalog, so it is an artifact of its own.
      - name: Fill in the forum topic
        run: |
          set -eu
          mkdir forum
          sed "s/{VERSION}/$PLUGIN_VERSION/" docs/catalog/forum-topic.txt > forum/forum-topic.txt

      - uses: actions/upload-artifact@v6
        with:
          name: aimp_remote_control-forum-topic
          path: forum/forum-topic.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/plugin-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      # The release's text is its section of CHANGELOG.md, from its heading
      # "## <version> — <date>" to the next one.
      - name: Take the release notes from the changelog
        run: |
          set -eu
          version="${GITHUB_REF_NAME#plugin-v}"
          awk -v head="## $version " 'index($0, "## ") == 1 { if (on) exit; on = index($0, head) == 1; next } on' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          cat release-notes.md

      - uses: actions/download-artifact@v7
        with:
          name: aimp_remote_control.aimppack

      - uses: softprops/action-gh-release@v3
        with:
          files: aimp_remote_control.aimppack
          body_path: release-notes.md
